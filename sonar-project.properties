sonar.projectKey=storytold_figcraft
sonar.organization=storytold

# Pinned integration-test fonts are data, not source code for analysis.
sonar.exclusions=craft-fonts/**

# Setting test roots disables the CLI default; keep all production sources analyzed. These exact
# fixture runners are the Nightly's tests, not production code; the packaging code they exercise
# stays analyzed (do not exclude the directory).
sonar.sources=.
sonar.tests=packaging
sonar.test.inclusions=packaging/nightly-tests.py,packaging/nightly-icon-tests.py,packaging/macos/nightly_plist_tests.py,packaging/macos/nightly_sign_tests.py,packaging/windows/nightly-package-tests.ps1,packaging/windows/nightly-signing-tests.ps1,packaging/nightly-release-tests.py

# Packaging scripts and their unittest suites are not measured by Rust coverage.
sonar.coverage.exclusions=packaging/**

# S4790 (weak hash): a .fig file names each image by the SHA-1 of its bytes (20 bytes, the only
# length readers accept). It is an identifier the format fixes, not a security choice.
sonar.issue.ignore.multicriteria=fig_image_sha1,gha-lockfile
sonar.issue.ignore.multicriteria.fig_image_sha1.ruleKey=rust:S4790
sonar.issue.ignore.multicriteria.fig_image_sha1.resourceKey=crates/format/src/fig/export.rs

# githubactions:S7637 asks for every action to be pinned to a commit SHA. A workflow covered by
# .github/workflows/actions.lock runs the commit the lockfile records, so its tag refs are pinned
# and the lockfile covers the actions those actions use too. Sonar does not read lockfiles yet, so
# the rule flags the tag refs anyway:
# https://community.sonarsource.com/t/githubactions-s7637-false-positives-for-actions-pinned-through-native-actions-lock/190814
sonar.issue.ignore.multicriteria.gha-lockfile.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.gha-lockfile.resourceKey=.github/workflows/**

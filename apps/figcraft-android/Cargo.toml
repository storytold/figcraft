[package]
name = "figcraft-android"
description = "FigCraft on Android: eframe + wgpu shell on GameActivity, reusing the desktop engine and egui UI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The workspace forbids `unsafe`; the Android entry point needs `#[unsafe(no_mangle)]`, so this
# crate follows the `crates/platform` precedent: `deny`, with `#[allow(unsafe_code)]` on the entry
# only. Deliberately NOT `[lints] workspace = true`, which would bring back `forbid`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[lib]
name = "main"
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
figcraft-engine = { workspace = true }
figcraft-ui-egui = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# accesskit + native-activity is a hard `compile_error!` in eframe, and NativeActivity has no soft
# keyboard/IME, so a ribbon + formula-bar app must use GameActivity.
eframe = { workspace = true, default-features = false, features = [
    "default_fonts",
    "wgpu",
    "android-game-activity",
] }
winit = { version = "0.30", default-features = false }
android_logger = "0.15"
jni = "0.22"
ndk-context = "0.1"

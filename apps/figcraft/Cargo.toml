[package]
name = "figcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "FigCraft desktop app"
default-run = "figcraft"

[lib]
# The desktop binary is a shim over this library (and other hosts can open the same app).
crate-type = ["rlib"]

[lints]
workspace = true

[dependencies]
figcraft-engine = { workspace = true }
figcraft-ui-egui = { workspace = true }
figcraft-collab-net = { workspace = true }
figcraft-format = { workspace = true }
figcraft-text = { workspace = true }
# Shared decision of who draws the window frame on Linux (compositor vs. app), replacing the
# bespoke Wayland xdg-decoration probe. See `[workspace.dependencies]`: pinned to the unmerged
# craft-libs#217 branch and must be repointed to a merged `rev` before this PR is mergeable.
craft-window = { workspace = true }
egui = { workspace = true }
# The desktop features (`accesskit`, `clipboard`, `wayland`, `x11`) are desktop-only target
# dependencies below: eframe only builds AccessKit with a desktop backend set, egui's clipboard has
# no backend on Android, and Wayland and X11 don't exist on a phone.
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
serde_json = { workspace = true }
log = { workspace = true }
webbrowser = { workspace = true }
image = { workspace = true }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

# The system's reduce-motion setting (UISettings.AnimationsEnabled), interface language
# (GlobalizationPreferences.Languages) and controllers for prototypes (Gaming.Input.Gamepad).
[target.'cfg(windows)'.dependencies]
craft-update = { workspace = true }
windows = { version = "0.62", default-features = false, features = ["UI_ViewManagement", "System_UserProfile", "Foundation_Collections", "Gaming_Input"] }

# The system colour scheme (org.freedesktop.portal.Settings): winit reports no theme on Linux and
# the BSDs, so the interface's "system" mode follows the portal's instead. zbus comes in through
# accesskit already; this only makes it direct.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# Finder double-clicks, Open With, Dock drops and `open -a FigCraft file.figcraft` arrive as a
# kAEOpenDocuments Apple event, which winit 0.30 doesn't handle. This crate (also used by GridCraft,
# EffectCraft and PhotoCraft) registers the handler behind a safe API (Objective-C interop needs
# unsafe, which the workspace forbids). Pinned exactly: review the diff before bumping.
[target.'cfg(target_os = "macos")'.dependencies]
fmv-macos-events = "=0.1.0"

[dev-dependencies]
wat = { workspace = true }

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Use vector window controls without a title-font renderer or embedded Cantarell. The compositor
# probe that used to need raw-window-handle and wayland-client here now lives in craft-window.
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita-notitle"] }

# Native file dialogs (Open, Save As, Export): rfd has no backend for Android (it does not compile
# there), so the dialog requests answer cancelled (the in-app file browser is a later step).
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
rfd = { workspace = true }
# The system clipboard beyond egui's text (pictures, HTML): no backend for Android either. Keeps
# `wayland-data-control` (already in the build through it, at this version).
arboard = { workspace = true, features = ["image-data", "wayland-data-control"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
# Not on Android: eframe only builds `accesskit` there with a desktop backend set, egui's clipboard
# has no backend either, and Wayland and X11 don't exist on a phone.
eframe = { workspace = true, features = ["accesskit", "clipboard", "wayland", "x11"] }

[target.'cfg(target_os = "android")'.dependencies]
# The NativeActivity handle eframe's event loop needs (`NativeOptions.android_app`); the same 0.6
# instance winit and eframe use, so the handle passes across crates as one type.
android-activity = { version = "0.6", default-features = false, features = ["native-activity"] }
# eframe's Android backend (NativeActivity via winit). Without it android-activity builds with no
# backend and fails to compile.
eframe = { workspace = true, features = ["android-native-activity"] }

# Local builds pick up the optional craft-fonts checkout next to this repo (Inter etc.). When the
# directory is missing the build warns and carries on with egui's bundled fonts and system fonts.
[env]
CRAFT_FONTS_DIR = { value = "../craft-fonts", relative = true }

# The Windows UI Automation adapter can be asked about a node that disappeared in the
# same frame. On MinGW, converting that HRESULT through windows-result's thread COM
# error-info path has crashed in GetErrorInfo. Keep the HRESULT without that extra
# COM lookup; this leaves the AccessKit tree and screen-reader support enabled.
[target.x86_64-pc-windows-gnu]
rustflags = ["--cfg=windows_slim_errors"]

[alias]
xtask = "run -q -p xtask --"

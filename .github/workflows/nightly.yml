name: FigCraft unsigned nightly

# Enabled for supervised manual runs by the reviewed manual actors only; no schedule yet.
# A later explicit opt-in may add a cadence (and a completion dispatcher with it).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned:
    # Actual context guards only; no inherited/platform secrets.
    if: >-
      github.repository == 'storytold/figcraft' &&
      github.ref == 'refs/heads/main' && github.ref_type == 'branch' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    # Maximum for the reusable workflow. Its compiler narrows to contents/actions read;
    # no OIDC, attestation write, release environment or platform secrets in compilation.
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    uses: storytold/craft-common-actions/.github/workflows/nightly-unsigned.yml@fc7124a1defa96813aee060031dc8b4d2afa3652
    with:
      tooling-revision: fc7124a1defa96813aee060031dc8b4d2afa3652
      app-name: figcraft
      manual-actors: '["bflatastic","dylanmtaylor","echelon","FredApps","skylartaylor"]'
      craft-fonts-ref: 37827adc41fd165f9a9234ac40f94dbad353aa69
      # One producer run builds every listed platform for one all-or-nothing release. The pin is the
      # craft-common-actions main commit that merged the Windows and macOS registry rows (#370, after
      # #369 and #364).
      platforms: '["windows-x86_64","linux-x86_64","macos-aarch64"]'

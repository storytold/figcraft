name: FigCraft release-ref nightly signer

# Enabled for supervised manual dispatch on the dedicated nightly-signer branch, which only ever
# fast-forwards to reviewed main commits (never the stable release branch).
# A reusable callee does not change context; this must be a real top-level signer-branch dispatch.
on:
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: Exact untrusted producer Actions run ID
        required: true
        type: string
      producer_run_attempt:
        description: Exact untrusted producer Actions run attempt
        required: true
        type: string

permissions: {}

concurrency:
  group: figcraft-nightly-release
  cancel-in-progress: false

jobs:
  release:
    # Actual context guards: official repository, manual dispatch, real nightly-signer branch.
    if: >-
      github.repository == 'storytold/figcraft' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/nightly-signer' && github.ref_type == 'branch'
    permissions:
      contents: write
      actions: read
      checks: read
      attestations: write
      id-token: write
    uses: storytold/craft-common-actions/.github/workflows/nightly-release.yml@bf94b15b708089b95c4e2d1c978e66ecf1f2f4f3
    with:
      tooling-revision: bf94b15b708089b95c4e2d1c978e66ecf1f2f4f3
      app-name: figcraft
      producer_run_id: ${{ inputs.producer_run_id }}
      producer_run_attempt: ${{ inputs.producer_run_attempt }}
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
      LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
    # No secrets: inherit or raw platform values in this caller. Only the isolated native
    # callee job may bind the release environment and export its keys; that environment must
    # admit nightly-signer alongside release before the first dispatch.

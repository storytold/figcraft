name: FigCraft release-ref nightly signer

# Enabled for supervised manual dispatch on the dedicated nightly-signer branch, which only ever
# fast-forwards to reviewed main commits (never the stable release branch).
# A reusable callee does not change context; this must be a real top-level signer-branch dispatch.
on:
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: Exact untrusted producer Actions run ID
        required: true
        type: string
      producer_run_attempt:
        description: Exact untrusted producer Actions run attempt
        required: true
        type: string

permissions: {}

concurrency:
  group: figcraft-nightly-release
  cancel-in-progress: false

jobs:
  release:
    # Actual context guards: official repository, manual dispatch, real nightly-signer branch.
    if: >-
      github.repository == 'storytold/figcraft' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/nightly-signer' && github.ref_type == 'branch'
    permissions:
      contents: write
      actions: read
      checks: read
      attestations: write
      id-token: write
    uses: storytold/craft-common-actions/.github/workflows/nightly-release.yml@be00e5ccd18b68e950c8a08532f2230e7c3d0cba
    with:
      tooling-revision: be00e5ccd18b68e950c8a08532f2230e7c3d0cba
      app-name: figcraft
      producer_run_id: ${{ inputs.producer_run_id }}
      producer_run_attempt: ${{ inputs.producer_run_attempt }}
    # No secrets: inherit or raw platform values in this caller. Only the isolated native
    # callee job may bind the release environment and export its keys; that environment must
    # admit nightly-signer alongside release before the first dispatch.

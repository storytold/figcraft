<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120">
  <!-- Dashes; butt, round and square caps; miter, round and bevel joins. -->
  <line id="dashed" x1="10" y1="10" x2="190" y2="10" stroke="#000000" stroke-width="4" stroke-dasharray="20 10"/>
  <line id="round-cap" x1="20" y1="40" x2="60" y2="40" stroke="#ff0000" stroke-width="10" stroke-linecap="round"/>
  <line id="butt-cap" x1="80" y1="40" x2="120" y2="40" stroke="#0000ff" stroke-width="10"/>
  <line id="square-cap" x1="140" y1="40" x2="180" y2="40" stroke="#00ff00" stroke-width="10" stroke-linecap="square"/>
  <polyline id="miter" points="20,100 50,70 80,100" fill="none" stroke="#000000" stroke-width="10" stroke-miterlimit="4"/>
  <polyline id="round-join" points="90,100 120,70 150,100" fill="none" stroke="#000000" stroke-width="10" stroke-linejoin="round"/>
  <polyline id="bevel" points="160,100 190,70 220,100" fill="none" stroke="#000000" stroke-width="10" stroke-linejoin="bevel"/>
  <!-- A dashed line starts and ends with half a dash: 10 on, 10 off, 20 on, 10 off, … -->
  <!-- probe 15 10 #000000ff -->

[package]
name = "figcraft-text"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FigCraft text: font database (embedded craft-fonts + system fonts), shaping, line layout, glyph outlines"

[lints]
workspace = true

[dependencies]
figcraft-geom = { workspace = true }
figcraft-doc = { workspace = true }
skrifa = { workspace = true }
harfrust = { workspace = true }
# Colour emoji: sbix/CBDT strikes are PNG images the text layer decodes for the renderer.
png = { workspace = true }
unicode-bidi = { workspace = true }
unicode-segmentation = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

# Fonts that font managers (RightFont, FontBase, Typeface) activate without copying them into a font
# folder are known only to Core Text. Its safe wrappers list every available font's file (Core Text
# needs unsafe FFI, which the workspace forbids). 22.0 is the first release whose
# `get_descriptors` takes ownership of the array correctly (20.x and 21.x leak it on every scan);
# it brings core-foundation 0.10, core-graphics 0.25 and core-graphics-types 0.2 beside the older
# versions other crates use. Pinned exactly: review the diff before bumping.
[target.'cfg(target_os = "macos")'.dependencies]
core-text = { version = "=22.0.0", default-features = false, features = ["link"] }
objc2 = "0.6"

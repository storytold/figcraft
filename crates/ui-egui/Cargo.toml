[package]
name = "figcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FigCraft egui frontend (the Figma-style UI: canvas, toolbar, layers, design and prototype panels, menus); swappable: nothing below depends on it"

[lints]
workspace = true

[dependencies]
figcraft-geom = { workspace = true }
figcraft-color = { workspace = true }
figcraft-doc = { workspace = true }
figcraft-text = { workspace = true }
figcraft-layout = { workspace = true }
figcraft-render = { workspace = true }
figcraft-pathops = { workspace = true }
figcraft-engine = { workspace = true }
figcraft-format = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
egui_extras = { workspace = true }
web-time = "1.1.0"

[build-dependencies]
serde_json = { workspace = true }
toml = "1"

[dev-dependencies]
wat = { workspace = true }
# A font with a made-up family name for the font download test (already here through krilla).
write-fonts = { version = "0.48", features = ["read"] }

# FigCraft interface strings: English, the source language.
#
# Keys are the English text as the code writes it (`tr("…")`, `trf`, `trn`, `tr_noop`); values are
# the same text, except plural entries ({ one, other }). Command labels come from the engine.
# `cargo test -p figcraft-ui-egui i18n` lists missing and unused keys. See docs/translating.md.

[meta]
name = "English"


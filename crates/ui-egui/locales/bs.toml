# FigCraft interface strings: Bosnian (bosanski), Latin script, ijekavian.
#
# Written from the English catalog with ordinary Bosnian software vocabulary; no other catalog and no
# proprietary localisation was translated from. Brand names and keyboard glyphs stay as they are.
# Buttons and menu items use bare imperatives (Sačuvaj, Izbriši); instructions use the formal Vi
# (Odaberite, Kliknite). Plurals follow CLDR: one (1, 21, 31…), few (2–4, 22–24…), other.

[meta]
name = "Bosanski"
status = "draft — needs native review"


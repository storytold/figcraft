# Draft — needs native review: machine-drafted from the English catalog. Brand names, keyboard
# glyphs and {placeholders} stay as they are. Concise UI style, full-width punctuation （）：，、。“”
# in Chinese text, a space between Chinese and Latin words or numbers. No plural forms: plural
# entries give only `other`.
# See docs/translating.md.


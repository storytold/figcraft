# FigCraft interface strings: Georgian.
#
# Written with AI assistance (Claude) from the meaning of each English string, following the glossary
# the Craft apps share, and reviewed by a native Georgian speaker; kept as a draft until a maintainer
# changes its status. Brand names and keyboard glyphs stay as they are. Georgian has no letter case,
# and a noun after a numeral stays singular, so counts read "შრე: {n}" and plural entries give the
# same text for one and other. See docs/translating.md.

[meta]
name = "ქართული"
status = "draft — reviewed by a native speaker, awaiting a maintainer's approval"


# FigCraft interface strings: Latin American Spanish.
#
# Draft — needs native review. An overlay on es.toml: it lists only the entries whose wording
# differs in Latin American usage (agregar for añadir, presionar for pulsar, configuración for
# settings, Enter for the Intro key, control for a gamepad, resorte for a spring); everything else
# reads es.toml (then English). Same tú register as es.toml. See docs/translating.md.

[meta]
name = "Español (Latinoamérica)"
status = "draft — needs native review"


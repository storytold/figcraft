# FigCraft interface strings: Turkish.
#
# Machine-drafted from the English catalog and reviewed by a native speaker. Brand names and keyboard
# glyphs stay as they are. Buttons and menu items are bare imperatives (Kaydet, Sil); instructions
# address the user politely (-in/-ın: "seçin", "tıklayın"). The percent sign goes before the number
# (%50). Turkish nouns stay singular after a count, so plural entries give only `other`. See
# docs/translating.md.

[meta]
name = "Türkçe"


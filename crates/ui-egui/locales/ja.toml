# FigCraft interface strings: Japanese.
#
# Draft — needs native review: machine-drafted from the English catalog. Brand names, keyboard
# glyphs and {placeholders} stay as they are. Concise UI style without です/ます endings,
# full-width punctuation （）「」：、。 where Japanese UI text uses it. No plural forms: plural
# entries give only `other`.
# See docs/translating.md.


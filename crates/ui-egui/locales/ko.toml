# Draft — needs native review: machine-drafted from the English catalog. Brand names, keyboard
# glyphs and {placeholders} stay as they are. Concise UI labels without 합니다 endings
# (instructions end in -세요). No plural forms: plural entries give only `other`.
# See docs/translating.md.


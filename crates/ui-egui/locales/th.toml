# FigCraft interface strings: Thai.
#
# Draft — needs native review: machine-drafted from the English catalog. Brand names, keyboard
# glyphs and {placeholders} stay as they are. Concise UI style without ครับ/ค่ะ endings, bare
# imperatives for buttons and menu items (บันทึก, ลบ), no spaces between Thai words (a space only
# separates clauses and Thai from Latin words or numbers). Established design terms are
# transliterated as Thai designers say them (เฟรม, เลเยอร์, คอมโพเนนต์, อินสแตนซ์, แวเรียนต์,
# ออโต้เลย์เอาต์, โปรโตไทป์). No plural forms: plural entries give only `other`.
# See docs/translating.md.


"The link carries the session's secret: share it only with people you invite." = "இணைப்பில் அமர்வின் ரகசியம் உள்ளது: நீங்கள் அழைக்கும் நபர்களுடன் மட்டும் பகிரவும்."
"The name in your online files and on the server. The document inside keeps its own name." = "உங்கள் ஆன்லைன் கோப்புகளிலும் சர்வரிலும் காட்டப்படும் பெயர். உள்ளே உள்ள ஆவணம் தன் பெயரையே வைத்திருக்கும்."
"The selection uses several text styles: click to apply one" = "தேர்வில் பல உரை ஸ்டைல்கள் உள்ளன: ஒன்றைப் பயன்படுத்தக் கிளிக் செய்யவும்"

# Finnish interface catalog. Original translations; MIT OR Apache-2.0.
# AI-assisted draft; not reviewed by a human Finnish/native speaker.
# Sentence case, imperative commands. Integer plurals: 1 taso, 0/2/21 tasoa.
# Product names, shortcut notation, numeric glyphs and code examples retain their identity.
# Command ids and context suffixes are immutable keys; translated text is display-only.
# Completeness measured against the English UI and live command/menu source sets; see tests.


# FigCraft interface strings: Arabic (العربية).
# Draft translation from the meaning of FigCraft's English catalog and command labels.
# Contributed by @hussain-hz with OpenAI Codex; not yet reviewed by a native speaker.
# No proprietary localisation tables or translated interfaces were consulted.
# Modern Standard Arabic; product names, keyboard glyphs and placeholders are preserved.
# Count-neutral wording (e.g. "عدد الطبقات: {n}") is deliberate: the current runtime has
# no Arabic zero/two categories. Each English plural entry uses only `other`, correct for
# every integer, without misclassifying Arabic counts or changing other languages' rules.
# Stored in logical Unicode order; panel mirroring remains separate work.
# MIT OR Apache-2.0. See ATTRIBUTION.md and docs/translating.md.

